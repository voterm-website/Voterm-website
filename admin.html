<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOTREM Admin</title><link rel="stylesheet" href="assets/style.css"></head><body><section class="admin-header"><div class="wrap"><h1 style="margin:0">VOTREM Administration</h1><p style="margin:4px 0 0;color:#cbd5e1">Secure content management dashboard</p></div></section><main class="admin-wrap"><div id="loginBox" class="form login"><h2>Admin Sign In</h2><div class="field"><label>Email</label><input id="adminEmail" type="email"></div><div class="field"><label>Password</label><input id="adminPassword" type="password"></div><div class="form-actions"><button class="btn" id="loginBtn">Sign In</button></div><div id="loginStatus" class="status"></div></div><div id="dashboard" class="hidden"><div class="admin-row" style="justify-content:space-between"><h2>Dashboard</h2><button id="logoutBtn" class="secondary">Sign Out</button></div><div class="admin-tabs"><button class="active" data-tab="teachings">Teachings</button><button data-tab="programmes">Programmes</button><button data-tab="books">Books</button></div><section class="admin-panel active" id="teachings"><form class="form contentForm" data-table="teachings"><h3>Add Teaching</h3><div class="form-grid"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Category</label><input name="category" placeholder="Teaching, Sermon, Bible Study"></div><div class="field full"><label>Summary</label><textarea name="summary"></textarea></div><div class="field full"><label>Video / Audio URL</label><input name="video_url"></div></div><div class="form-actions"><button class="btn" type="submit">Publish Teaching</button></div></form><div class="admin-list" data-list="teachings"></div></section><section class="admin-panel" id="programmes"><form class="form contentForm" data-table="programmes"><h3>Add Programme</h3><div class="form-grid"><div class="field"><label>Programme</label><input name="title" required></div><div class="field"><label>Date</label><input name="programme_date" placeholder="e.g. 12 October 2026"></div><div class="field"><label>Location</label><input name="location"></div><div class="field full"><label>Details</label><textarea name="details"></textarea></div></div><div class="form-actions"><button class="btn" type="submit">Publish Programme</button></div></form><div class="admin-list" data-list="programmes"></div></section><section class="admin-panel" id="books"><form class="form contentForm" data-table="books"><h3>Add Book</h3><div class="form-grid"><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Cover Image URL</label><input name="cover_url"></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field full"><label>Book / Resource URL</label><input name="file_url"></div></div><div class="form-actions"><button class="btn" type="submit">Publish Book</button></div></form><div class="admin-list" data-list="books"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="assets/admin.js"></script></body></html>
