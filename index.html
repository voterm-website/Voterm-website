<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice on the Rock Evangelical Mission | VOTREM</title>

    <meta name="description"
          content="Voice on the Rock Evangelical Mission — Proclaiming Christ, Building Lives.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =========================================================
           VOTREM — EXECUTIVE ECCLESIASTICAL
           ========================================================= */

        :root {
            --navy: #081d3a;
            --navy-dark: #041326;
            --navy-light: #102b4d;

            --gold: #d9aa35;
            --gold-light: #f0ca65;
            --gold-dark: #a87b18;

            --cream: #f8f6ef;
            --white: #ffffff;
            --text: #172033;
            --muted: #697180;

            --border: rgba(217,170,53,.35);

            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "Inter", Arial, sans-serif;

            --max: 1240px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--sans);
            color: var(--text);
            background: var(--cream);
            line-height: 1.7;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            font: inherit;
        }

        .container {
            width: min(92%, var(--max));
            margin: auto;
        }

        /* =========================================================
           HEADER
           ========================================================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(4, 19, 38, .97);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }

        .nav {
            min-height: 86px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
            min-width: 245px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: var(--gold);
            font-size: 27px;
        }

        .brand-text strong {
            display: block;
            color: var(--white);
            font-family: var(--serif);
            font-size: 23px;
            line-height: 1;
            letter-spacing: .5px;
        }

        .brand-text span {
            display: block;
            color: var(--gold);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .brand-text small {
            display: block;
            color: #d8dce3;
            font-family: var(--serif);
            font-style: italic;
            font-size: 12px;
            margin-top: 2px;
        }

        nav ul {
            display: flex;
            align-items: center;
            gap: 24px;
            list-style: none;
        }

        nav a {
            color: #f2f3f5;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .4px;
            transition: .25s ease;
        }

        nav a:hover,
        nav a.active {
            color: var(--gold-light);
        }

        .nav-cta {
            padding: 13px 18px;
            border: 1px solid var(--gold);
            color: var(--gold-light);
        }

        .nav-cta:hover {
            background: var(--gold);
            color: var(--navy-dark);
        }

        .menu-btn {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: var(--gold);
            padding: 8px 11px;
            cursor: pointer;
        }

        /* =========================================================
           HERO
           ========================================================= */

        .hero {
            min-height: 670px;
            position: relative;
            overflow: hidden;
            background:
                linear-gradient(90deg,
                    rgba(4,19,38,.98) 0%,
                    rgba(4,19,38,.94) 35%,
                    rgba(4,19,38,.52) 65%,
                    rgba(4,19,38,.45) 100%),
                url("hero.jpg") center/cover no-repeat;
        }

        /*
          Replace hero.jpg with your VOTREM worship/service image.
          If no image is available, the navy background still works.
        */

        .hero-inner {
            min-height: 670px;
            display: grid;
            grid-template-columns: 1.45fr .55fr;
            align-items: center;
            gap: 60px;
            padding: 70px 0;
        }

        .eyebrow {
            color: var(--gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 17px;
        }

        .hero h1 {
            color: var(--white);
            font-family: var(--serif);
            font-size: clamp(54px, 6vw, 88px);
            line-height: .88;
            font-weight: 600;
            max-width: 720px;
        }

        .hero h1 span {
            color: var(--gold-light);
        }

        .hero-subtitle {
            color: var(--white);
            font-family: var(--serif);
            font-size: clamp(25px, 3vw, 40px);
            margin-top: 16px;
            line-height: 1;
        }

        .hero-rule {
            width: 420px;
            max-width: 100%;
            height: 1px;
            background: var(--gold);
            margin: 25px 0;
        }

        .hero-description {
            max-width: 600px;
            color: #dfe4eb;
            font-size: 16px;
        }

        .scripture {
            border-left: 3px solid var(--gold);
            padding: 12px 0 12px 20px;
            margin-top: 25px;
            max-width: 650px;
            color: #f0f2f4;
            font-family: var(--serif);
            font-size: 18px;
            font-style: italic;
        }

        .scripture strong {
            display: block;
            color: var(--gold-light);
            font-size: 13px;
            font-style: normal;
            margin-top: 7px;
            letter-spacing: 1px;
        }

        .hero-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 22px;
            border: 1px solid var(--gold);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
            transition: .25s ease;
        }

        .btn-gold {
            background: var(--gold);
            color: var(--navy-dark);
        }

        .btn-gold:hover {
            background: var(--gold-light);
        }

        .btn-outline {
            color: var(--white);
        }

        .btn-outline:hover {
            background: var(--gold);
            color: var(--navy-dark);
        }

        /* Service panel */

        .service-panel {
            border: 1px solid var(--gold-dark);
            background: rgba(5,23,45,.92);
            padding: 25px;
        }

        .service-panel h3 {
            font-family: var(--serif);
            color: var(--white);
            font-size: 24px;
            margin-bottom: 18px;
        }

        .service {
            display: flex;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(217,170,53,.35);
        }

        .service:last-child {
            border-bottom: none;
        }

        .service-icon {
            color: var(--gold);
            font-size: 21px;
            width: 30px;
        }

        .service strong {
            display: block;
            color: var(--gold-light);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .7px;
        }

        .service span {
            color: #dce0e6;
            font-size: 12px;
        }

        /* =========================================================
           FOUNDATION
           ========================================================= */

        .foundation {
            background: var(--cream);
            padding: 70px 0 65px;
        }

        .section-heading {
            text-align: center;
            max-width: 760px;
            margin: 0 auto 40px;
        }

        .section-heading .eyebrow {
            margin-bottom: 7px;
        }

        .section-heading h2 {
            font-family: var(--serif);
            color: var(--navy);
            font-size: clamp(34px, 4vw, 48px);
            line-height: 1;
        }

        .section-heading p {
            color: var(--muted);
            margin-top: 12px;
            font-family: var(--serif);
            font-style: italic;
        }

        .pillars {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-top: 1px solid #c9c2b3;
            border-bottom: 1px solid #c9c2b3;
        }

        .pillar {
            padding: 28px 15px;
            text-align: center;
            border-right: 1px solid #c9c2b3;
        }

        .pillar:last-child {
            border-right: none;
        }

        .pillar-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 14px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            background: var(--navy);
            color: var(--gold-light);
            display: grid;
            place-items: center;
            font-size: 22px;
        }

        .pillar h3 {
            font-family: var(--serif);
            color: var(--navy);
            font-size: 20px;
        }

        .pillar p {
            color: #626875;
            font-family: var(--serif);
            font-style: italic;
            font-size: 13px;
            line-height: 1.35;
            margin-top: 6px;
        }

        /* =========================================================
           INTRODUCTION
           ========================================================= */

        .intro {
            background: var(--white);
            padding: 85px 0;
        }

        .intro-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .intro-image {
            min-height: 430px;
            background:
                linear-gradient(rgba(8,29,58,.2),rgba(8,29,58,.3)),
                url("mission.jpg") center/cover;
        }

        .intro-copy .eyebrow {
            margin-bottom: 8px;
        }

        .intro-copy h2 {
            font-family: var(--serif);
            color: var(--navy);
            font-size: clamp(38px, 4vw, 56px);
            line-height: .95;
            margin-bottom: 22px;
        }

        .intro-copy p {
            color: #535b69;
            margin-bottom: 18px;
        }

        .principle {
            margin-top: 28px;
            border-top: 1px solid #d8d1c4;
            padding
