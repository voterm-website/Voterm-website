<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOTREM Official Forms</title>
<script src="https://cdn.tailwindcss.com"></script><script src="./config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{brand:{900:'#0b132b',800:'#1e3a8a'},gold:{500:'#f59e0b',600:'#d97706'}},fontFamily:{heading:['Cinzel','serif'],body:['Plus Jakarta Sans','sans-serif']}}}}</script>
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.font-heading{font-family:Cinzel,serif}</style>
</head>
<body class="bg-slate-50 text-slate-900">
<header class="bg-brand-900 text-white border-b border-amber-500/30"><div class="max-w-5xl mx-auto px-4 py-6 flex items-center justify-between gap-4"><a href="index.html" class="font-heading font-bold text-lg">VOICE ON THE ROCK <span class="text-amber-400">EVANGELICAL MISSION</span></a><a href="index.html" class="text-xs font-bold px-4 py-2 rounded-lg border border-white/20 hover:bg-white/10">Back to Website</a></div></header>
<main class="max-w-5xl mx-auto px-4 py-10">
<div class="text-center mb-8"><span class="text-gold-600 font-bold uppercase tracking-wider text-xs">Proclaiming Christ, Building Lives</span><h1 class="font-heading text-3xl sm:text-4xl font-bold mt-2">Official VOTREM Forms</h1><p class="text-slate-600 text-sm mt-3">Complete the form carefully. Your submission is sent securely to the Mission office. Sensitive information is handled through the secure backend.</p></div>
<div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-4 sm:p-8">
<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-8" id="tabs"></div>
<form id="official-form" class="space-y-6"><div id="form-fields"></div><input type="text" id="website" class="hidden" tabindex="-1" autocomplete="off"><button id="submit-btn" type="submit" class="w-full py-4 rounded-xl bg-gold-500 hover:bg-gold-600 text-slate-950 font-extrabold text-xs uppercase tracking-wider">Submit Application</button></form>
<div id="result" class="hidden mt-5 p-4 rounded-xl text-sm"></div>
</div>
</main>
<script>
const forms={
 membership:{title:'Membership Registration',fields:[['surname','Surname','text'],['first_name','First Name','text'],['other_names','Other Name(s)','text'],['gender','Gender','select','Male|Female'],['date_of_birth','Date of Birth','date'],['marital_status','Marital Status','select','Single|Married|Widowed|Other'],['occupation','Occupation','text'],['nationality','Nationality','text'],['state_of_origin','State of Origin','text'],['lga','Local Government Area','text'],['home_address','Home Address','textarea'],['phone','Phone Number','tel'],['whatsapp','WhatsApp Number','tel'],['email','Email Address','email'],['next_of_kin','Next of Kin Name','text'],['next_of_kin_relationship','Next of Kin Relationship','text'],['next_of_kin_phone','Next of Kin Phone','tel'],['christ_date','When did you give your life to Christ?','text'],['water_baptized','Have you been Water Baptized?','select','Yes|No'],['water_baptism_date','Water Baptism Date','date'],['holy_spirit_baptized','Have you received the Baptism of the Holy Spirit?','select','Yes|No'],['former_church','Former Church','text'],['reason_leaving','Reason for leaving','textarea'],['first_attended','Date you first attended VOTREM','date'],['heard_about','How did you hear about us?','select','Friend|Evangelism|Social Media|Internet|Family|Other'],['committed_member','Do you desire to become a committed member?','select','Yes|No'],['department_interest','Preferred Department','text'],['gifts','Gifts / Talents','textarea'],['prayer_request','Prayer Request','textarea'],['declaration','Declaration','checkbox','I declare that the information provided is true and correct.']]},
 worker:{title:"Worker's Application",fields:[['surname','Surname','text'],['first_name','First Name','text'],['other_names','Other Name(s)','text'],['gender','Gender','select','Male|Female'],['date_of_birth','Date of Birth','date'],['marital_status','Marital Status','select','Single|Married|Widowed|Other'],['nationality','Nationality','text'],['state_of_origin','State of Origin','text'],['lga','L.G.A.','text'],['home_address','Home Address','textarea'],['phone','Phone Number','tel'],['whatsapp','WhatsApp Number','tel'],['email','Email Address','email'],['christ_date','Date You Accepted Jesus Christ','text'],['water_baptism_date','Date of Water Baptism','date'],['holy_ghost_baptism_date','Date of Holy Ghost Baptism','date'],['current_church','Current Church / Assembly','text'],['votrem_duration','How long have you worshipped with VOTREM?','text'],['department','Department Applying For','text'],['why_worker','Why do you want to become a worker?','textarea'],['previous_service','Have you served in any church before? Explain.','textarea'],['gifts_skills','Spiritual Gifts / Talents','textarea'],['health_condition','Health condition that may affect service (optional)','textarea'],['emergency_contact','Emergency Contact Name / Relationship / Phone','textarea'],['declaration','Declaration','checkbox','I hereby declare that all information supplied is true and correct and I am willing to serve faithfully in VOTREM.']]},
 minister:{title:"Minister's Application",fields:[['surname','Surname','text'],['first_name','First Name','text'],['other_names','Other Name(s)','text'],['gender','Gender','select','Male|Female'],['date_of_birth','Date of Birth','date'],['marital_status','Marital Status','select','Single|Married|Widowed'],['occupation','Occupation','text'],['nationality','Nationality','text'],['state_of_origin','State of Origin','text'],['lga','Local Government Area','text'],['address','Residential Address','textarea'],['phone','Phone Number','tel'],['whatsapp','WhatsApp Number','tel'],['email','Email Address','email'],['christ_date','Date You Accepted Jesus Christ','text'],['water_baptism_date','Date of Water Baptism','date'],['holy_spirit_baptism_date','Date of Holy Spirit Baptism','date'],['current_church','Church Currently Worshipping','text'],['former_church','Former Church','text'],['years_ministry','Years in Ministry','text'],['current_office','Current Ministry Office','text'],['calling','Briefly describe your calling into ministry','textarea'],['experience','List previous ministry experiences','textarea'],['doctrinal_agreement','Do you agree with VOTREM Statement of Faith, Constitution, Vision, Mission and Core Values?','select','Yes|No'],['doctrinal_explanation','If No, explain','textarea'],['gifts','Gifts / Ministry Areas','textarea'],['reference_one','Reference One','textarea'],['reference_two','Reference Two','textarea'],['declaration','Declaration','checkbox','I hereby declare that the information provided is true and correct and I willingly submit myself to the doctrines, constitution, discipline and spiritual authority of VOTREM.']]},
 volunteer:{title:'Volunteer Registration',fields:[['surname','Surname','text'],['first_name','First Name','text'],['other_names','Other Name(s)','text'],['gender','Gender','select','Male|Female'],['date_of_birth','Date of Birth','date'],['marital_status','Marital Status','select','Single|Married|Widowed'],['occupation','Occupation','text'],['nationality','Nationality','text'],['state_of_origin','State of Origin','text'],['lga','Local Government Area','text'],['address','Residential Address','textarea'],['phone','Phone Number','tel'],['whatsapp','WhatsApp Number','tel'],['email','Email Address','email'],['emergency_contact','Emergency Contact Name / Relationship / Phone','textarea'],['accepted_christ','Have you accepted Jesus Christ as your Lord and Saviour?','select','Yes|No'],['christ_date','Date (if known)','text'],['votrem_member','Are you a member of VOTREM?','select','Yes|No'],['former_church','If No, state your church','text'],['why_volunteer','Why would you like to volunteer with VOTREM?','textarea'],['availability','How often are you available to serve?','textarea'],['area_interest','Area(s) of Interest','textarea'],['skills','Skills and Experience','textarea'],['previous_volunteer','Previous volunteer experience','textarea'],['declaration','Declaration','checkbox','I certify that the information provided is true and complete and agree to serve faithfully and uphold the doctrines and values of VOTREM.']]}};
const params=new URLSearchParams(location.search);let current=params.get('form')||'membership';if(!forms[current])current='membership';
function render(){const tabs=document.getElementById('tabs');tabs.innerHTML=Object.entries(forms).map(([k,v])=>`<button type="button" onclick="setForm('${k}')" class="p-3 rounded-lg text-xs font-bold border ${k===current?'bg-brand-900 text-white border-brand-900':'bg-white text-slate-700 border-slate-200'}">${v.title}</button>`).join('');const box=document.getElementById('form-fields');box.innerHTML=`<div class="mb-5"><h2 class="font-heading text-xl font-bold text-brand-900">${forms[current].title}</h2><p class="text-xs text-slate-500 mt-1">Voice on the Rock Evangelical Mission — Proclaiming Christ, Building Lives</p></div>`+forms[current].fields.map(f=>field(f)).join('');}
function field(f){const [id,label,type,opts]=f;if(type==='textarea')return `<div><label class="block text-xs font-bold text-slate-700 uppercase mb-2">${label}</label><textarea id="f-${id}" rows="3" ${id==='prayer_request'?'':'required'} class="w-full p-3 rounded-lg border border-slate-300 text-sm"></textarea></div>`;if(type==='checkbox')return `<label class="flex items-start gap-3 p-4 rounded-lg bg-amber-50 border border-amber-200 text-xs"><input id="f-${id}" type="checkbox" required class="mt-1"><span>${opts}</span></label>`;if(type==='select')return `<div><label class="block text-xs font-bold text-slate-700 uppercase mb-2">${label}</label><select id="f-${id}" required class="w-full p-3 rounded-lg border border-slate-300 text-sm"><option value="">Select</option>${opts.split('|').map(x=>`<option>${x}</option>`).join('')}</select></div>`;return `<div><label class="block text-xs font-bold text-slate-700 uppercase mb-2">${label}</label><input id="f-${id}" type="${type}" ${id==='health_condition'?'':'required'} class="w-full p-3 rounded-lg border border-slate-300 text-sm"></div>`}
function setForm(k){current=k;history.replaceState({},'',`forms.html?form=${k}`);render();window.scrollTo({top:0,behavior:'smooth'})}
async function submit(){const cfg=window.VOTREM_CONFIG||{};if(!cfg.functionsUrl||cfg.functionsUrl.includes('YOUR_SUPABASE')){throw new Error('Online form service is not connected. Finish config.js setup first.')}const payload={};for(const f of forms[current].fields){const el=document.getElementById('f-'+f[0]);if(el)payload[f[0]]=f[3]&&f[2]==='checkbox'?(el.checked?'Yes':'No'):el.value}payload.form_name=forms[current].title;payload.website=document.getElementById('website').value;const res=await fetch(cfg.functionsUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'submit_form',formType:forms[current].title,payload})});const data=await res.json();if(!res.ok||data.error)throw new Error(data.error||'Submission failed.');}
document.getElementById('official-form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit-btn'),result=document.getElementById('result');btn.disabled=true;btn.innerText='Submitting...';result.className='hidden';try{await submit();result.className='mt-5 p-4 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-800 text-sm';result.textContent='Your application has been received by Voice on the Rock Evangelical Mission.';document.getElementById('official-form').reset();}catch(err){result.className='mt-5 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm';result.textContent=err.message;}finally{btn.disabled=false;btn.innerText='Submit Application';}});render();
</script></body></html>
